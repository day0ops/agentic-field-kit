---
# FinFlow MCP servers — deployed into the finflow namespace on the east cluster.
# Agents running on AgentCore discover these via AgentRegistry (see finflow-demo usecase).
#
# Images: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/finflow-<name>:<tag>
# Tag pinned to 0.1.1; update when a new release is cut.
#
apiVersion: v1
kind: Namespace
metadata:
  name: finflow
  labels:
    app.kubernetes.io/managed-by: agentic-demo
    app.kubernetes.io/part-of: finflow
---
