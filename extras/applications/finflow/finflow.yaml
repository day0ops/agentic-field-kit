# ────────────────────────────────────────────────────────────────────────────
# orchestrator — A2A orchestrator agent; coordinates sub-agents via A2A protocol
# ────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: finflow
  labels:
    app: orchestrator
    app.kubernetes.io/part-of: finflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: server
          image: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/finflow-orchestrator:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MARKET_DATA_AGENT_URL
              value: 'http://market-data-agent.finflow.svc.cluster.local:8000'
            - name: NEWS_SENTIMENT_AGENT_URL
              value: 'http://news-sentiment-agent.finflow.svc.cluster.local:8000'
            - name: PORTFOLIO_AGENT_URL
              value: 'http://hub-agentgateway-proxy.agentgateway-proxy.svc.cluster.local/finflow/portfolio-agent'
            - name: TRADE_EXECUTION_AGENT_URL
              value: 'http://hub-agentgateway-proxy.agentgateway-proxy.svc.cluster.local/finflow/trade-execution-agent'
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '500m'
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: finflow
  labels:
    app: orchestrator
    app.kubernetes.io/part-of: finflow
spec:
  selector:
    app: orchestrator
  ports:
    - name: http
