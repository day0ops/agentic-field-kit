apiVersion: agentic.demo/v1
kind: UseCase
metadata:
  name: zero-trust-l4
  description: Enforce zero-trust L4 security with deny-all policy and explicit allow rules
spec:
  category: security
  requires:
    applications:
      - name: bookinfo
        namespace: bookinfo
        clusters:
          - name: WEST
            infra: eks-ipv6

  features:
    - name: gateway
      description: Create ingress gateway for Bookinfo
      config:
        gatewayName: bookinfo
        namespace: bookinfo
        gateway:
          listeners:
            - name: http
              hostname: bookinfo.example.com
              port: 80
              protocol: HTTP
              allowedRoutes:
                namespaces:
                  from: Same
      clusters:
        - name: WEST
          infra: eks-ipv6

    - name: request-routing
      description: Route traffic to productpage
      config:
        routeName: bookinfo
        namespace: bookinfo
        gatewayName: bookinfo
        gatewayNamespace: bookinfo
        hostname: bookinfo.example.com
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: productpage
                port: 9080
      clusters:
        - name: WEST
          infra: eks-ipv6

    - name: deny-all-policy
      description: Deny all traffic to bookinfo namespace
      config:
        policyName: deny-all
        namespace: bookinfo
      clusters:
        - name: WEST
          infra: eks-ipv6

    - name: authorization-policy
      description: Allow gateway to productpage
      config:
        policyName: allow-ingress-productpage
        namespace: bookinfo
        action: ALLOW
        rules:
          - from:
              - source:
                  principals:
                    - cluster.local/ns/bookinfo/sa/bookinfo
            to:
              - operation:
                  ports:
                    - '9080'
      clusters:
        - name: WEST
          infra: eks-ipv6

    - name: authorization-policy
      description: Allow productpage to reviews
      config:
        policyName: allow-productpage-reviews
        namespace: bookinfo
        action: ALLOW
        rules:
          - from:
              - source:
                  principals:
                    - cluster.local/ns/bookinfo/sa/bookinfo-productpage
            to:
              - operation:
                  ports:
                    - '9080'
      clusters:
        - name: WEST
          infra: eks-ipv6

  tests:
    - name: bookinfo-accessible
      description: Verify bookinfo is accessible through the gateway with zero-trust policies
      clusters:
        - name: WEST
          infra: eks-ipv6
      steps:
        - action: send-request
          hostname: bookinfo.example.com
          autoDetectGwAddress: true
          path: /productpage
          timeout: 30s
        - action: verify
          expect:
            statusCode: 200
