apiVersion: agentic.demo/v1
kind: UseCase
metadata:
  name: sidecar-ambient-interop
  description: '[Enterprise] Hybrid sidecar+ambient architecture. Waypoints enforce policy for traffic from sidecars and ingress gateways using istio.io/ingress-use-waypoint label.'
spec:
  category: security
  requires:
    applications:
      - name: bookinfo
        namespace: bookinfo
        clusters:
          - name: WEST
            infra: eks-ipv6

  features:
    - name: gateway
      description: Create ingress gateway for Bookinfo
      config:
        gatewayName: bookinfo
        namespace: bookinfo
        gateway:
          listeners:
            - name: http
              hostname: bookinfo.example.com
              port: 80
              protocol: HTTP
              allowedRoutes:
                namespaces:
                  from: Same
      clusters:
        - name: WEST
          infra: eks-ipv6

    - name: request-routing
      description: Route traffic to productpage
      config:
        routeName: bookinfo
        namespace: bookinfo
        gatewayName: bookinfo
        gatewayNamespace: bookinfo
        hostname: bookinfo.example.com
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: productpage
                port: 9080
      clusters:
        - name: WEST
          infra: eks-ipv6

    - name: waypoint
      description: Deploy waypoint for bookinfo with ingress-use-waypoint support
      config:
        waypointName: bookinfo-waypoint
        namespace: bookinfo
        labels:
          target: namespace
      clusters:
        - name: WEST
          infra: eks-ipv6

    - name: authorization-policy
      description: L7 policy enforced for both sidecar and ambient traffic
      config:
        policyName: allow-ingress-to-productpage
        namespace: bookinfo
        action: ALLOW
        targetRefs:
          - kind: Gateway
            group: gateway.networking.k8s.io
            name: bookinfo-waypoint
        rules:
          - from:
              - source:
                  principals:
                    - cluster.local/ns/bookinfo/sa/bookinfo
            to:
              - operation:
                  methods:
                    - GET
                  paths:
                    - /productpage
                    - /productpage/*
      clusters:
        - name: WEST
          infra: eks-ipv6

  tests:
    - name: bookinfo-accessible
      description: Verify bookinfo is accessible via hybrid sidecar+ambient architecture
      clusters:
        - name: WEST
          infra: eks-ipv6
      steps:
        - action: send-request
          hostname: bookinfo.example.com
          autoDetectGwAddress: true
          path: /productpage
          timeout: 30s
        - action: verify
          expect:
            statusCode: 200
