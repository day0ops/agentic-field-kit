apiVersion: agentic.demo/v1
kind: UseCase
metadata:
  name: fault-injection
  description: Inject faults (delays and errors) into service traffic via waypoint for resilience testing
spec:
  category: traffic-management

  requires:
    applications:
      - name: bookinfo
        namespace: bookinfo

  features:
    - name: gateway
      description: Create ingress gateway for Bookinfo
      config:
        gatewayName: bookinfo
        namespace: bookinfo
        gateway:
          listeners:
            - name: http
              hostname: bookinfo.example.com
              port: 80
              protocol: HTTP
              allowedRoutes:
                namespaces:
                  from: Same

    - name: request-routing
      description: Route traffic to productpage
      config:
        routeName: bookinfo
        namespace: bookinfo
        gatewayName: bookinfo
        gatewayNamespace: bookinfo
        hostname: bookinfo.example.com
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: productpage
                port: 9080

    - name: waypoint
      description: Deploy waypoint proxy for ratings service
      config:
        waypointName: ratings-waypoint
        namespace: bookinfo
        labels:
          target: service
          serviceName: ratings

    - name: fault-injection
      description: Inject 500 errors on 50% of requests to ratings
      config:
        routeName: ratings-fault
        namespace: bookinfo
        host: ratings
        faultType: abort
        abort:
          httpStatus: 500
          percentage: 50

  tests:
    - name: bookinfo-accessible
      description: Verify bookinfo is accessible with fault injection configured
      steps:
        - action: send-request
          hostname: bookinfo.example.com
          autoDetectGwAddress: true
          path: /productpage
          timeout: 30s
        - action: verify
          expect:
            statusCode: 200
