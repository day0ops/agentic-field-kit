apiVersion: agentic.demo/v1
kind: UseCase
metadata:
  name: expose-bookinfo
  description: Expose the Bookinfo application via an Istio ingress gateway with HTTPRoute routing
spec:
  category: traffic-management

  requires:
    applications:
      - name: bookinfo
        namespace: bookinfo

  features:
    - name: gateway
      description: Create ingress gateway for Bookinfo
      config:
        gatewayName: bookinfo
        namespace: bookinfo
        gateway:
          listeners:
            - name: http
              hostname: bookinfo.example.com
              port: 80
              protocol: HTTP
              allowedRoutes:
                namespaces:
                  from: Same

    - name: request-routing
      description: Route traffic to Bookinfo productpage
      config:
        routeName: bookinfo
        namespace: bookinfo
        gatewayName: bookinfo
        gatewayNamespace: bookinfo
        hostname: bookinfo.example.com
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: productpage
                port: 9080

  tests:
    - name: bookinfo-accessible
      description: Verify bookinfo productpage is exposed and accessible
      steps:
        - action: send-request
          hostname: bookinfo.example.com
          autoDetectGwAddress: true
          path: /productpage
          timeout: 30s
        - action: verify
          expect:
            statusCode: 200
