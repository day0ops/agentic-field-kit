apiVersion: agentic.demo/v1
kind: UseCase
metadata:
  name: header-based-routing
  description: Route traffic to different service versions based on HTTP headers via waypoint
spec:
  category: traffic-management

  requires:
    applications:
      - name: bookinfo
        namespace: bookinfo

  features:
    - name: gateway
      description: Create ingress gateway for Bookinfo
      config:
        gatewayName: bookinfo
        namespace: bookinfo
        gateway:
          listeners:
            - name: http
              hostname: bookinfo.example.com
              port: 80
              protocol: HTTP
              allowedRoutes:
                namespaces:
                  from: Same

    - name: request-routing
      description: Route traffic to productpage
      config:
        routeName: bookinfo
        namespace: bookinfo
        gatewayName: bookinfo
        gatewayNamespace: bookinfo
        hostname: bookinfo.example.com
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: productpage
                port: 9080

    - name: waypoint
      description: Deploy waypoint proxy for reviews service
      config:
        waypointName: reviews-waypoint
        namespace: bookinfo
        labels:
          target: service
          serviceName: reviews

    - name: header-routing
      description: Route test users to reviews v2, all others to v1
      config:
        routeName: reviews-header-routing
        namespace: bookinfo
        waypointName: reviews-waypoint
        rules:
          - matches:
              - headers:
                  - name: end-user
                    value: jason
            backendRefs:
              - name: reviews-v2
                port: 9080
          - backendRefs:
              - name: reviews-v1
                port: 9080

  tests:
    - name: bookinfo-accessible
      description: Verify bookinfo is accessible with header-based routing configured
      steps:
        - action: send-request
          hostname: bookinfo.example.com
          autoDetectGwAddress: true
          path: /productpage
          timeout: 30s
        - action: verify
          expect:
            statusCode: 200
