apiVersion: agentic.demo/v1
kind: UseCase
metadata:
  name: add-services-to-mesh
  description: |
    Add Bookinfo workloads to the ambient mesh on multiple clusters.
    - Namespaces are labeled istio.io/dataplane-mode=ambient when applications deploy
    - Workloads in labeled namespaces are enrolled in ambient L4 dataplane (ztunnel)

spec:
  diagram: |
    flowchart LR
      subgraph west
        NSW[bookinfo\nambient]
        PPw[productpage]
        Rw[reviews]
      end
      subgraph east
        NSE[bookinfo\nambient]
        PPe[productpage]
        Re[reviews]
      end
      NSW --> PPw & Rw
      NSE --> PPe & Re

  infra: eks-multi-cluster

  requires:
    applications:
      - name: bookinfo
        namespace: bookinfo
        clusters:
          - name: west
          - name: east

  tests:
    - name: namespace-ambient-labeled
      description: Verify bookinfo namespace is labeled for ambient dataplane on both clusters
      steps:
        - action: exec
          clusters:
            - name: west
          command: kubectl get namespace bookinfo -o jsonpath='{.metadata.labels.istio\.io/dataplane-mode}'
          timeout: 15s
        - action: verify
          expect:
            contains: ambient
        - action: exec
          clusters:
            - name: east
          command: kubectl get namespace bookinfo -o jsonpath='{.metadata.labels.istio\.io/dataplane-mode}'
          timeout: 15s
        - action: verify
          expect:
            contains: ambient

    - name: in-cluster-mesh-traffic
      description: Verify productpage can reach reviews over the mesh within each cluster
      steps:
        - action: exec
          clusters:
            - name: west
          command: kubectl exec -n bookinfo deploy/productpage-v1 -- curl -s -o /dev/null -w '%{http_code}' http://reviews:9080/reviews/1
          timeout: 30s
          retries: 5
          retryDelay: 6000
        - action: verify
          expect:
            contains: '200'
        - action: exec
          clusters:
            - name: east
          command: kubectl exec -n bookinfo deploy/productpage-v1 -- curl -s -o /dev/null -w '%{http_code}' http://reviews:9080/reviews/1
          timeout: 30s
          retries: 5
          retryDelay: 6000
        - action: verify
          expect:
            contains: '200'
