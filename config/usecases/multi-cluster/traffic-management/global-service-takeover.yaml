apiVersion: agentic.demo/v1
kind: UseCase
metadata:
  name: global-service-takeover
  description: |
    Demonstrate cross-cluster service discovery with global service scope and service takeover.
    - Services labeled solo.io/service-scope=global get a unified mesh.internal hostname
    - reviews labeled solo.io/service-takeover=true redirects in-cluster callers to the global hostname
    - Annotate reviews with networking.istio.io/traffic-distribution: Any to distribute across clusters
    - Endpoints from both clusters are merged under the same global hostname
    - Uses Istio ingress gateway for ingress traffic to productpage on east cluster

spec:
  diagram: |
    flowchart LR
      Client -->|HTTP| IGW[istio ingress gw\nistio-ingress/east]
      IGW -->|HTTPRoute| PP[productpage\nbookinfo/east]
      PP -->|reviews\nservice-takeover| ZTe[ztunnel east]
      ZTe -->|HBONE/mTLS| EWG[east-west gw]
      EWG --> ZTw[ztunnel west]
      ZTw --> R[reviews west]

  infra: eks-multi-cluster

  requires:
    applications:
      - name: bookinfo
        namespace: bookinfo
        clusters:
          - name: west
          - name: east

  features:
    - name: global-service
      description: Make bookinfo services globally accessible
      config:
        namespace: bookinfo
        services:
          - name: productpage
            scope: global
          - name: reviews
            scope: global
            labels:
              solo.io/service-takeover: 'true'
            annotations:
              networking.istio.io/traffic-distribution: Any
      clusters:
        - name: west
        - name: east

    - name: ingress-httproute
      description: Route external traffic to productpage
      config:
        gatewayName: httpbin-gateway
        gatewayNamespace: istio-ingress
        namespace: bookinfo
        hostname: '{{env.domains.app.main}}'
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: productpage
                port: 9080
      clusters:
        - name: east

  tests:
    - name: global-service-entries-exist
      description: Verify global ServiceEntry resources are created for bookinfo services on both clusters
      steps:
        - action: exec
          clusters:
            - name: west
          command: kubectl get serviceentry -n istio-system -o jsonpath='{.items[*].spec.hosts[*]}'
          timeout: 20s
        - action: verify
          expect:
            contains:
              - productpage.bookinfo.mesh.internal
              - reviews.bookinfo.mesh.internal
        - action: exec
          clusters:
            - name: east
          command: kubectl get serviceentry -n istio-system -o jsonpath='{.items[*].spec.hosts[*]}'
          timeout: 20s
        - action: verify
          expect:
            contains:
              - productpage.bookinfo.mesh.internal
              - reviews.bookinfo.mesh.internal

    - name: reviews-global-endpoints
      description: Verify istioctl zc shows cross-cluster autogen WorkloadEntry for reviews on east
      clusters:
        - name: east
      steps:
        - action: istioctl-zc-endpoints
          service: reviews
          serviceNamespace: bookinfo
          timeout: 30s
          retries: 5
          retryDelay: 6000
        - action: verify
          expect:
            contains:
              - autogen.west.bookinfo.reviews
              - Healthy

    - name: productpage-accessible
      description: Verify productpage is reachable via Istio ingress gateway
      clusters:
        - name: east
      steps:
        - action: send-request
          hostname: '{{env.domains.app.main}}'
          autoDetectGwAddress: true
          path: /productpage
          timeout: 30s
          retries: 5
          retryDelay: 6000
        - action: verify
          expect:
            statusCode: 200
