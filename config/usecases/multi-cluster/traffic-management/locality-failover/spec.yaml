apiVersion: agentic.demo/v1
kind: UseCase
metadata:
  name: locality-failover
  description: Traffic distribution with PreferClose/PreferRegion/PreferNetwork annotations for locality-aware failover across zones and regions
spec:
  category: multicluster
  clusters:
    - name: WEST
      infra: eks-ipv6
    - name: EAST
      infra: eks-ipv6
  requires:
    applications:
      - name: bookinfo
        namespace: bookinfo
        clusters:
          - name: WEST
            infra: eks-ipv6
          - name: EAST
            infra: eks-ipv6

  features:
    - name: eastwest-gateway
      description: Deploy east-west gateways on all clusters
      config:
        namespace: istio-eastwest
        method: istioctl
        clusters:
          - name: WEST
            context: '{{WEST_CONTEXT}}'
          - name: EAST
            context: '{{EAST_CONTEXT}}'

    - name: cluster-link
      description: Link clusters
      config:
        namespace: istio-eastwest
        verify: true
        clusters:
          - name: WEST
            context: '{{WEST_CONTEXT}}'
          - name: EAST
            context: '{{EAST_CONTEXT}}'

    - name: global-service
      description: Make services globally accessible with locality annotations
      config:
        namespace: bookinfo
        services:
          - name: productpage
            scope: global
          - name: reviews
            scope: global
          - name: ratings
            scope: global
      clusters:
        - name: WEST
          infra: eks-ipv6
        - name: EAST
          infra: eks-ipv6

    - name: gateway
      description: Create ingress gateway on WEST
      config:
        gatewayName: bookinfo
        namespace: bookinfo
        gateway:
          listeners:
            - name: http
              hostname: bookinfo.example.com
              port: 80
              protocol: HTTP
              allowedRoutes:
                namespaces:
                  from: Same
      clusters:
        - name: WEST
          infra: eks-ipv6

    - name: request-routing
      description: Route traffic to productpage
      config:
        routeName: bookinfo
        namespace: bookinfo
        gatewayName: bookinfo
        gatewayNamespace: bookinfo
        hostname: bookinfo.example.com
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: productpage
                port: 9080
      clusters:
        - name: WEST
          infra: eks-ipv6

  tests:
    - name: bookinfo-accessible
      description: Verify bookinfo is accessible with locality-aware failover
      clusters:
        - name: WEST
          infra: eks-ipv6
      steps:
        - action: send-request
          hostname: bookinfo.example.com
          autoDetectGwAddress: true
          path: /productpage
          timeout: 30s
        - action: verify
          expect:
            statusCode: 200
