apiVersion: agentic.demo/v1
kind: UseCase
metadata:
  name: segmented-canary
  description: Combine namespace segments with traffic shifting for segment-scoped canary deployments
spec:
  category: multicluster
  clusters:
    - name: WEST
      infra: eks-ipv6
    - name: EAST
      infra: eks-ipv6
  requires:
    applications:
      - name: bookinfo
        namespace: bookinfo
        clusters:
          - name: WEST
            infra: eks-ipv6
          - name: EAST
            infra: eks-ipv6

  features:
    - name: eastwest-gateway
      description: Deploy east-west gateways on all clusters
      config:
        namespace: istio-eastwest
        method: istioctl
        clusters:
          - name: WEST
            context: '{{WEST_CONTEXT}}'
          - name: EAST
            context: '{{EAST_CONTEXT}}'

    - name: cluster-link
      description: Link clusters
      config:
        namespace: istio-eastwest
        verify: true
        clusters:
          - name: WEST
            context: '{{WEST_CONTEXT}}'
          - name: EAST
            context: '{{EAST_CONTEXT}}'

    - name: segment
      description: Create canary segment
      config:
        segmentName: canary-segment
        namespace: gloo-mesh
        domain: canary.global
      clusters:
        - name: WEST
          infra: eks-ipv6

    - name: global-service
      description: Make services globally accessible within segment
      config:
        namespace: bookinfo
        services:
          - name: productpage
            scope: global
          - name: reviews
            scope: global
      clusters:
        - name: WEST
          infra: eks-ipv6
        - name: EAST
          infra: eks-ipv6

    - name: waypoint
      description: Deploy waypoint for reviews in WEST
      config:
        waypointName: reviews-waypoint
        namespace: bookinfo
        labels:
          target: service
          serviceName: reviews
      clusters:
        - name: WEST
          infra: eks-ipv6

    - name: traffic-shifting
      description: Canary traffic across clusters
      config:
        routeName: reviews-segment-canary
        namespace: bookinfo
        waypointName: reviews-waypoint
        rules:
          - backendRefs:
              - name: reviews-v1
                port: 9080
                weight: 80
              - name: reviews-v2
                port: 9080
                weight: 20
      clusters:
        - name: WEST
          infra: eks-ipv6

  tests:
    - name: segment-canary-active
      description: Verify segmented canary HTTPRoute is active
      clusters:
        - name: WEST
          infra: eks-ipv6
      steps:
        - action: exec
          command: kubectl get httproute reviews-segment-canary -n bookinfo -o name
          timeout: 15s
        - action: verify
          expect:
            contains: httproute
