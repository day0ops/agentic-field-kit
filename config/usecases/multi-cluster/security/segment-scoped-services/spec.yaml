apiVersion: agentic.demo/v1
kind: UseCase
metadata:
  name: segment-scoped-services
  description: 'Services with solo.io/service-scope=segment are visible only within their segment across clusters, demonstrating team-scoped multi-cluster visibility'
spec:
  category: multicluster
  clusters:
    - name: WEST
      infra: eks-ipv6
    - name: EAST
      infra: eks-ipv6
  requires:
    applications:
      - name: bookinfo
        namespace: bookinfo
        clusters:
          - name: WEST
            infra: eks-ipv6
          - name: EAST
            infra: eks-ipv6

  features:
    - name: eastwest-gateway
      description: Deploy east-west gateways on all clusters
      config:
        namespace: istio-eastwest
        method: istioctl
        clusters:
          - name: WEST
            context: '{{WEST_CONTEXT}}'
          - name: EAST
            context: '{{EAST_CONTEXT}}'

    - name: cluster-link
      description: Link clusters
      config:
        namespace: istio-eastwest
        verify: true
        clusters:
          - name: WEST
            context: '{{WEST_CONTEXT}}'
          - name: EAST
            context: '{{EAST_CONTEXT}}'

    - name: segment
      description: Create team-a segment
      config:
        segmentName: team-a
        namespace: gloo-mesh
        domain: team-a.global
        namespaceSelector:
          matchLabels:
            team: team-a
      clusters:
        - name: WEST
          infra: eks-ipv6

    - name: global-service
      description: Scope bookinfo services to segment only
      config:
        namespace: bookinfo
        services:
          - name: productpage
            scope: segment
          - name: reviews
            scope: segment
          - name: ratings
            scope: segment
          - name: details
            scope: segment
      clusters:
        - name: WEST
          infra: eks-ipv6
        - name: EAST
          infra: eks-ipv6

  tests:
    - name: segment-scoped-labels
      description: Verify services are labeled with segment-scoped visibility
      clusters:
        - name: WEST
          infra: eks-ipv6
      steps:
        - action: exec
          command: kubectl get svc productpage -n bookinfo -o jsonpath='{.metadata.labels.solo\.io/service-scope}'
          timeout: 15s
        - action: verify
          expect:
            contains: segment
