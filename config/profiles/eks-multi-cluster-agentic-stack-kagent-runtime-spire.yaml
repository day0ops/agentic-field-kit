apiVersion: agentic.demo/v1
kind: Profile
metadata:
  name: eks-multi-cluster-agentic-stack-kagent-runtime-spire
  description: |
    Agents run on the in-cluster kagent runtime with agentregistry integration. Multicluster ambient mesh (helm peering) with SPIRE workload identity.
    Global: cilium, cert-manager, spire (pre-phase).
    East: external-dns, keycloak, telemetry gateway, solo-ui (mgmt), enterprise agentgateway, enterprise agentregistry, enterprise kagent.
    West: telemetry agent, solo-ui relay, enterprise agentgateway.

spec:
  infra: eks-multi-cluster
  environment: aws-dev

  mesh:
    istioVersion: 1.30.3
    gatewayApiVersion: v1.5.0
    profile: ambient
    peering: helm

    image:
      istioRepo: us-docker.pkg.dev/soloio-img/istio
      helmIstioRepo: us-docker.pkg.dev/soloio-img/istio-helm
      tag: 1.30.3-solo

    components:
      - name: base
        values:
          defaultRevision: ''

      - name: istiod
        values:
          env:
            # disables trust domain validation when generating xDS config, set when different domains (false)
            PILOT_SKIP_VALIDATE_TRUST_DOMAIN: 'true'
            # enables new IP autoallocation controller for ServiceEntry resources lacking user-supplied addresses (true)
            PILOT_ENABLE_IP_AUTOALLOCATE: 'true'
            # disables legacy remote-secrets-based multicluster entirely (true)
            DISABLE_LEGACY_MULTICLUSTER: 'true'
            # ----- optional -----
            # gate for entire debug endpoint auth system. When false: all /debug/* endpoints open to any caller, no SPIFFE check, no namespace restriction. related to DEBUG_ENDPOINT_AUTH_ALLOWED_NAMESPACES (true)
            ENABLE_DEBUG_ENDPOINT_AUTH: 'true'
            # needs full access to istiod debug endpoints to function
            DEBUG_ENDPOINT_AUTH_ALLOWED_NAMESPACES: 'gloo-mesh'
            # allows Kubernetes Service selectors to match WorkloadEntry resources (not just pods) (true)
            PILOT_ENABLE_K8S_SELECT_WORKLOAD_ENTRIES: 'true'
          global:
            multiCluster:
              clusterName: '{{cluster.name}}'
            network: '{{cluster.name}}'
            proxy:
              clusterDomain: cluster.local
          gateways:
            spire:
              workloads: true
          meshConfig:
            accessLogFile: /dev/stdout
            trustDomain: '{{cluster.name}}.local'
            enableTracing: true
            extensionProviders:
              - name: ambient-tracing
                opentelemetry:
                  port: 4317
                  service: '{{env.internal.telemetry.otelTracesCollector}}'
            defaultConfig:
              proxyMetadata:
                # tells the sidecar/agent to intercept DNS queries
                ISTIO_META_DNS_CAPTURE: 'true'
          pilot:
            cni:
              namespace: istio-system
              enabled: true
          platforms:
            # activates push-based multicluster peering system in istiod
            peering:
              enabled: true

      - name: cni
        values:
          ambient:
            dnsCapture: true
          excludeNamespaces:
            - istio-system
            - kube-system

      - name: ztunnel
        values:
          env:
            # enables L7 observability feature (false)
            L7_ENABLED: 'true'
            # start DNS proxy
            ISTIO_META_DNS_CAPTURE: 'true'
            # disables trust domain validation when generating xDS config, set when different domains (false)
            SKIP_VALIDATE_TRUST_DOMAIN: 'true'
            # disable in EKS environments
            IPV6_ENABLED: false
          spire:
            enabled: true
          l7Telemetry:
            distributedTracing:
              otlpEndpoint: 'http://{{env.internal.telemetry.otelTracesCollector}}:4317'
          configValidation: true
          istioNamespace: istio-system
          namespace: istio-system
          multiCluster:
            clusterName: '{{cluster.name}}'
          network: '{{cluster.name}}'
          proxy:
            clusterDomain: cluster.local
          terminationGracePeriodSeconds: 29
          variant: distroless

      # SPIRE_ENABLED=false is intentional: Solo's SPIRE docs never register the
      # east-west gateway with SPIRE, and ztunnel's gateway-mode SPIRE client
      # (dedicated_ca_client.rs) has a confirmed DER/PEM parsing bug. Cross-cluster
      # mTLS works because each cluster's independent SPIRE root is federated with
      # istiod's shared cacerts root and every peer cluster's SPIRE root
      # (distinctRoots: true, see addons/spire/index.js).
      - name: peering-eastwest
        values:
          eastwest:
            cluster: '{{cluster.name}}'
            network: '{{cluster.name}}'
            service:
              metadata:
                annotations:
                  service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
            deployment:
              spec:
                template:
                  spec:
                    containers:
                      - name: istio-proxy
                        env:
                          - name: SPIRE_ENABLED
                            value: 'false'

      # peering remote
      - name: peering-remote
        values:
          trustDomain: '{{cluster.name}}.local'
          addressType: Hostname
          preferredDataplaneServiceType: LoadBalancer

    certificates:
      mode: self-signed

  addons:
    clusters:
      - name: east
        addons:
          - name: aws-load-balancer-controller
            description: AWS Load Balancer Controller (IRSA-backed NLB/ALB provisioning)
            version: 3.5.0
            config:
              clusterName: '{{infra.clusters.east.cluster}}'
              serviceAccountRoleArn: '{{infra.clusters.east.iam.albControllerRoleArn}}'
              vpcId: '{{infra.clusters.east.network.vpcId}}'

          - name: external-dns
            description: Automatic DNS record management via Route53
            namespace: external-dns
            version: 1.21.1
            config:
              provider: route53
              domainFilter: '{{env.dns.childZone}}.{{env.dns.parentZone.domain}}'
              region: '{{env.aws.region}}'
              txtOwnerId: '{{env.dns.txtOwnerId}}'

          - name: keycloak
            description: Keycloak OIDC provider
            phase: post
            namespace: keycloak
            keycloakImage: '{{env.keycloak.image}}'
            postgresVersion: 18.2-alpine
            config:
              postgres:
                persistentVolume:
                  storageClass: gp3
                  size: 5Gi
              hostname: '{{env.domains.core.keycloak}}'
              loginTheme: '{{env.keycloak.loginTheme}}'
              # Keycloak is OIDC issuer for agentregistry/agentgateway/kagent/solo-ui, so
              # in-cluster pods hairpin out through the internet and back in via its public
              # hostname/NLB for token validation. Both clusters' NAT Gateway egress IPs are
              # allowlisted alongside the VPN range so that hairpin traffic isn't blocked.
              sourceRanges:
                - '{{env.security.vpnSourceRanges}}'
                - '{{infra.clusters.east.network.natGatewayIp}}/32'
                - '{{infra.clusters.west.network.natGatewayIp}}/32'
              tls:
                enabled: true
                createCertificate: true
                clusterIssuerName: letsencrypt-dns
                organization: solo.io
              soloUiClients:
                enabled: true
                realm: solo-ui
                hostname: 'https://{{env.domains.core.soloUi}}'
                additionalHostnames:
                  - '{{env.kagent.scheme}}://{{env.domains.core.kagentUi}}'
                  - 'https://{{env.domains.core.agentgatewayUi}}'
                  - 'https://{{env.domains.core.meshUi}}'
                backendClientId: solo-ui-backend
                backendClientSecret: solo-ui-backend-secret
                frontendClientId: solo-ui-frontend
              realms:
                - realm: agentregistry
                  groups:
                    - admins
                  clients:
                    - clientId: ar-backend
                      type: confidential
                      clientSecret: ar-backend-secret
                      flows: []
                    - clientId: ar-cli
                      type: public
                      flows:
                        - device
                        - direct-access
                      groupMembership: true
                      audience: ar-backend
                    - clientId: ar-ui
                      type: public
                      flows:
                        - authorization-code
                      clientAttributes:
                        pkce.code.challenge.method: S256
                      groupMembership: true
                      audience: ar-backend
                      redirectUris:
                        - 'https://{{env.domains.core.agentregistryUi}}/*'
                      # The UI's own logout flow (AuthOidcContext.tsx) always redirects to
                      # `${origin}/logout`, not the bare origin -- Keycloak's post-logout-redirect
                      # match is exact, so registering only the bare origin here rejects every
                      # real logout with "Invalid redirect uri" (confirmed live).
                      postLogoutRedirectUris:
                        - 'https://{{env.domains.core.agentregistryUi}}/logout'
                  users:
                    - username: admin-user
                      email: admin-user@example.com
                      firstName: Admin
                      lastName: User
                      memberOf:
                        - admins
                  # password sourced from AGENTREGISTRY_REALM_DEFAULT_PASSWORD, not this profile

                - realm: grafana
                  groups:
                    - grafana-admins
                  clients:
                    - clientId: grafana
                      type: confidential
                      clientSecret: grafana-client-secret
                      flows:
                        - authorization-code
                      groupMembership: true
                      redirectUris:
                        - 'https://{{env.domains.core.grafana}}/login/generic_oauth'
                      postLogoutRedirectUris:
                        - 'https://{{env.domains.core.grafana}}'
                  users:
                    # username/password sourced from GRAFANA_REALM_ADMIN_USERNAME (default:
                    # grafana-admin) and GRAFANA_REALM_ADMIN_PASSWORD, not this profile
                    - email: grafana-admin@example.com
                      firstName: Grafana
                      lastName: Admin
                      memberOf:
                        - grafana-admins

                - realm: kagent
                  groups:
                    - kagent-admins
                    - kagent-writers
                    - kagent-readers
                    - agentregistry
                  clients:
                    - clientId: agentregistry
                      type: confidential
                      clientSecret: agentregistry-secret
                      flows:
                        - service-account
                      groupMembership: true
                      serviceAccountGroup: agentregistry
                    - clientId: kagent-backend
                      type: confidential
                      clientSecret: kagent-backend-secret
                      flows:
                        - authorization-code
                      groupMembership: true
                      redirectUris:
                        - '{{env.kagent.scheme}}://{{env.domains.core.kagentUi}}/*'
                        - 'https://{{env.domains.core.agentgatewayUi}}/*'
                        - 'https://{{env.domains.core.meshUi}}/*'
                        - 'https://{{env.domains.core.soloUi}}/*'
                      # solo-enterprise-ui's logout flow (AuthOidcContext.tsx) always redirects to
                      # `${origin}/logout`, not the bare origin -- Keycloak's post-logout-redirect
                      # match is exact, so a bare origin here rejects every real logout with
                      # "Invalid redirect uri" (confirmed live, same root cause as ar-ui above).
                      postLogoutRedirectUris:
                        - '{{env.kagent.scheme}}://{{env.domains.core.kagentUi}}/logout'
                        - 'https://{{env.domains.core.agentgatewayUi}}/logout'
                        - 'https://{{env.domains.core.meshUi}}/logout'
                        - 'https://{{env.domains.core.soloUi}}/logout'
                    - clientId: kagent-ui
                      type: public
                      flows:
                        - authorization-code
                      clientAttributes:
                        pkce.code.challenge.method: S256
                      groupMembership: true
                      audience: kagent-backend
                      redirectUris:
                        - '{{env.kagent.scheme}}://{{env.domains.core.kagentUi}}/*'
                        - 'https://{{env.domains.core.agentgatewayUi}}/*'
                        - 'https://{{env.domains.core.meshUi}}/*'
                        - 'https://{{env.domains.core.soloUi}}/*'
                      postLogoutRedirectUris:
                        - '{{env.kagent.scheme}}://{{env.domains.core.kagentUi}}/logout'
                        - 'https://{{env.domains.core.agentgatewayUi}}/logout'
                        - 'https://{{env.domains.core.meshUi}}/logout'
                        - 'https://{{env.domains.core.soloUi}}/logout'
                  users:
                    - username: kagent-admin
                      email: kagent-admin@example.com
                      firstName: Kagent
                      lastName: Admin
                      memberOf:
                        - kagent-admins
                    - username: kagent-writer
                      email: kagent-writer@example.com
                      firstName: Kagent
                      lastName: Writer
                      memberOf:
                        - kagent-writers
                    - username: kagent-reader
                      email: kagent-reader@example.com
                      firstName: Kagent
                      lastName: Reader
                      memberOf:
                        - kagent-readers
                  # password sourced from KAGENT_REALM_DEFAULT_PASSWORD, not this profile

                - realm: retail-returns-customers
                  description: 'Customer identity for the retail returns agent system demo (Stage 2: token exchange)'
                  # Stock Keycloak default is 300s (5 min) -- too short for a live guided
                  # tour spanning 10 stages; every downstream MCP/A2A call carries this same
                  # customer token for the whole session, so it needs enough runway to cover
                  # a full walkthrough without expiring mid-demo.
                  accessTokenLifespan: 1800
                  groups:
                    - customers
                  clients:
                    - clientId: retail-returns-ui
                      type: confidential
                      clientSecret: retail-returns-ui-secret
                      # authorization-code (the public gate's real Keycloak-redirect login)
                      # alongside direct-access (the in-tour ROPC fallback used only when
                      # there's no gate in front, e.g. local dev via port-forward). Both
                      # flows issue tokens for this SAME client deliberately -- the
                      # downstream RFC 8693 exchange (below) authenticates as this client
                      # too, and Keycloak's standard token exchange only permits a client
                      # to exchange tokens it issued itself ("self-exchange") without extra
                      # fine-grained cross-client permissions. A separate gate-only client
                      # was tried first and its tokens got a live 403 Forbidden on exchange
                      # for exactly this reason.
                      flows:
                        - direct-access
                        - authorization-code
                      redirectUris:
                        - 'https://{{env.domains.app.retailReturns}}/*'
                      postLogoutRedirectUris:
                        - 'https://{{env.domains.app.retailReturns}}'
                      groupMembership: true
                      # agentgateway's STS rejects an RFC 8693 delegation exchange unless the
                      # subject token (this client's own) carries a may_act claim whose sub
                      # list contains the actor token's subject -- confirmed in
                      # agentgateway-enterprise's sts/handler.go. The actor token here is each
                      # kagent agent's own Kubernetes ServiceAccount token (validated via the
                      # agentgateway addon's k8s actorValidators), so these are k8s token
                      # subjects (system:serviceaccount:<namespace>:<sa-name>), not Keycloak
                      # identities. refund-approval isn't deployed by the OBO prototype
                      # usecase but is included since it's part of the full retail-returns-demo
                      # topology and needs the same delegation capability.
                      hardcodedClaims:
                        may_act:
                          sub:
                            - system:serviceaccount:kagent-system:retail-returns-order-lookup
                            - system:serviceaccount:kagent-system:retail-returns-fraud-check
                            - system:serviceaccount:kagent-system:retail-returns-refund-approval
                      # Reused as the token-exchange-policy feature's clientAuth client
                      # (agentgateway authenticates as this client to Keycloak's token
                      # endpoint for the RFC 8693 exchange, not just for the customer's
                      # own ROPC login) -- Keycloak 26.2+ requires this attribute
                      # explicitly enabled per-client or the exchange endpoint rejects
                      # with "Standard token exchange is not enabled for the requested
                      # client", confirmed live against the deployed realm.
                      clientAttributes:
                        standard.token.exchange.enabled: 'true'
                  users:
                    - username: demo-customer
                      email: demo-customer@example.com
                      firstName: Demo
                      lastName: Customer
                      memberOf:
                        - customers
                    # Second customer identity for Stage 6 (budget control) -- two real
                    # customers, one budgeted Block, one budgeted Audit, distinguished by
                    # the customerEmail budget dimension (jwt.email).
                    - username: demo-customer-2
                      email: demo-customer-2@example.com
                      firstName: Demo
                      lastName: Customer2
                      memberOf:
                        - customers
                  # password sourced from RETAIL_RETURNS_CUSTOMER_PASSWORD, not this profile
                  # (same password for both users -- Stage 6 only needs distinct emails,
                  # not distinct credentials)

                - realm: finflow
                  customAttributes:
                    - role
                  clients:
                    - clientId: finflow-bff
                      type: confidential
                      clientSecret: finflow-bff-secret
                      flows:
                        - authorization-code
                      redirectUris:
                        - 'https://{{env.domains.app.main}}/*'
                      postLogoutRedirectUris:
                        - 'https://{{env.domains.app.main}}'
                  users:
                    - username: morgan
                      firstName: Morgan
                      lastName: Chen
                      email: morgan@finflow.demo
                      attributes:
                        role: trader
                    - username: alex
                      firstName: Alex
                      lastName: Rivera
                      email: alex@finflow.demo
                      attributes:
                        role: analyst
                  defaultPassword: Admin1234

                - realm: carrier-portal
                  description: "Mock third-party carrier OAuth IdP for Stage 9 (agentgateway interactive elicitation) -- stands in for a real carrier's OAuth server, same role Keycloak already plays for every other IdP need in this demo."
                  clients:
                    - clientId: carrier-portal-ui
                      type: confidential
                      clientSecret: carrier-portal-ui-secret
                      # authorization-code only -- this client is never used for direct
                      # login, only as the third-party OAuth provider the customer
                      # consents to mid Stage 9's linkCarrierAccount tool call.
                      flows:
                        - authorization-code
                      # Keycloak defaults consentRequired to false (login redirects straight
                      # back with the code, no explicit grant screen) -- this client stands in
                      # for a real carrier's OAuth provider, so it needs a real "Do you want to
                      # grant access?" consent step to actually demonstrate one (confirmed live
                      # 2026-09-13: without this, Stage 9's popup showed no consent screen).
                      consentRequired: true
                      redirectUris:
                        - 'https://{{env.domains.app.retailReturns}}/api/stage9/callback'
                  users:
                    - username: demo-carrier-customer
                      email: demo-carrier-customer@example.com
                      firstName: Demo
                      lastName: CarrierCustomer
                  # password sourced from CARRIER_PORTAL_REALM_DEFAULT_PASSWORD, not this profile

                - realm: sre-irs
                  description: "Entra-federated realm for the SRE incident response system demo (cross-domain MCP gateway identity federation) -- Keycloak here plays the role of a customer's existing Keycloak-federated-with-Entra domain."
                  clients:
                    - clientId: gateway-exchange
                      type: confidential
                      clientSecret: gateway-exchange-secret
                      # Keycloak-internal wiring secret (not a real external credential) --
                      # same convention as retail-returns-ui-secret/carrier-portal-ui-secret:
                      # committed literal, matched by token-exchange-policy's clientSecret in
                      # the sre-incident-response usecase spec. Only ever used for this
                      # client's own token-exchange call authentication, no interactive login.
                      flows:
                        - service-account
                      clientAttributes:
                        standard.token.exchange.enabled: 'true'
                  # UNVERIFIED end to end: registers Entra as a broker so Keycloak can
                  # validate an Entra-issued token's signature/issuer, but whether
                  # agentgateway's runtime exchange call actually resolves through
                  # Keycloak's external-token-exchange path (distinct from the
                  # same-client self-exchange already proven live via
                  # retail-returns-customers above) hasn't been confirmed against a real
                  # Entra tenant yet -- see docs/entra-tenant-setup.md.
                  identityProviders:
                    - alias: entra
                      displayName: Microsoft Entra ID
                      # Reuses agent-gateway's own Entra app registration (see
                      # docs/entra-tenant-setup.md 4b) rather than a dedicated broker-only
                      # registration -- fewer app registrations to manage. Revisit if
                      # Keycloak's external token exchange turns out to need its own
                      # redirect URI or app registration once tested live.
                      clientId: '{{env.entra.sreIRS.agentGatewayClientId}}'
                      clientSecretEnvVar: ENTRA_GATEWAY_CLIENT_SECRET
                      authorizationUrl: 'https://login.microsoftonline.com/{{env.entra.sreIRS.tenantId}}/oauth2/v2.0/authorize'
                      tokenUrl: 'https://login.microsoftonline.com/{{env.entra.sreIRS.tenantId}}/oauth2/v2.0/token'
                      jwksUrl: 'https://login.microsoftonline.com/{{env.entra.sreIRS.tenantId}}/discovery/v2.0/keys'
                      issuer: 'https://login.microsoftonline.com/{{env.entra.sreIRS.tenantId}}/v2.0'
                  clientPolicies:
                    - profileName: downscope-role-enforcer
                      profileDescription: "Caps a JWT Authorization Grant exchange to the roles carried in the original Entra assertion (app-role assignments), instead of Keycloak's built-in downscope-assertion-grant-enforcer's hardcoded scope claim, which Entra cannot emit."
                      executorProviderId: downscope-role-enforcer
                      policyName: downscope-role-enforcer-jwt-bearer
                      policyDescription: 'Applies downscope-role-enforcer to JWT Authorization Grant (RFC 7523) token exchanges in this realm.'
                      grantTypes:
                        - 'urn:ietf:params:oauth:grant-type:jwt-bearer'
                      # Must be a DEFAULT (not optional) client scope: gateway-exchange's token
                      # exchange call never sends an explicit scope param, and Keycloak only
                      # returns default-included scopes as candidates when the scope param is
                      # null -- confirmed live (2026-09-09) that without this, the executor's
                      # restrictedScopes output has no matching resource to attach to and the
                      # exchanged token's scope silently comes back empty regardless of the
                      # assertion's roles.
                      clientScopes:
                        - deployment.history.read
                      assignScopesToClientId: gateway-exchange

          - name: telemetry
            phase: post
            namespace: telemetry
            chartVersions:
              kube-prom-stack: 88.0.1
              loki: 7.2.0
              tempo: 1.61.3
              alloy: 1.11.0
              otel: 0.165.0
            config:
              database:
                storageClass: gp3
                storageSize: 100Gi
              globalExport: true
              soloUiNamespace: solo-enterprise
              grafanaHostname: '{{env.domains.core.grafana}}'
              sourceRanges: '{{env.security.vpnSourceRanges}}'
              grafanaTls:
                enabled: true
                secretName: grafana-tls
                issuer: letsencrypt-dns
              grafanaOidc:
                enabled: true
                issuerUrl: 'https://{{env.domains.core.keycloak}}/realms/grafana'
                clientId: grafana
                clientSecret: grafana-client-secret
                adminGroup: grafana-admins

          # agentgateway must install before solo-ui: solo-ui's productAliases
          # (below) apply EnterpriseAgentgatewayPolicy resources, a CRD only
          # agentgateway's own install brings onto the cluster. Confirmed live
          # (2026-09-03): "no matches for kind EnterpriseAgentgatewayPolicy"
          # when solo-ui ran first.
          - name: agentgateway
            description: AI Gateway Enterprise hub
            phase: post
            namespace: agentgateway-system
            version: '{{env.agentgateway.version}}'
            config:
              enterprise: true
              ambientEnabled: true
              soloUiNamespace: solo-enterprise
              tracesCollectorName: opentelemetry-collector-traces
              tracesCollectorNamespace: telemetry
              tracingRandomSampling: true
              # Stage 9 (agentgateway interactive elicitation): starts the controller's
              # own token-exchange/elicitation STS. jwtIssuer validates the same customer
              # JWT already used everywhere else in the demo (retail-returns-customers).
              tokenExchange:
                enabled: true
                # Must be reachable from in-cluster callers (e.g. kagent agents' own STS
                # exchange calls) at this exact scheme+host, since agentgateway echoes it
                # verbatim into its own .well-known/openid-configuration token_endpoint --
                # confirmed live (twice): /oauth2/token is served by this controller itself
                # (same port that serves .well-known, matching STS_WELL_KNOWN_URI's host:port
                # on the agent side), NOT by the hub-agentgateway-proxy data-plane Gateway --
                # pointing this at hub-agentgateway-proxy (with or without a real TLS
                # listener there) produced an advertised token_endpoint that gets a clean
                # 404 "route not found", since that Gateway never had this route at all.
                issuer: 'http://enterprise-agentgateway.agentgateway-system.svc.cluster.local:7777'
                jwtIssuer: '{{env.keycloak.scheme}}://{{env.domains.core.keycloak}}/realms/retail-returns-customers'
                # solo-ui's ui-backend forwards the browser's own session JWT (kagent realm,
                # see solo-ui's oidc.issuerUrl below) when proxying
                # /api/proxy/cluster/<cluster>/gg/* (e.g. Stage 9's elicitation list in agw-ui)
                # to this same STS's /elicitations endpoint -- apiValidators must trust that
                # realm too, or the UI gets a real 401 (confirmed live 2026-09-13).
                additionalApiValidatorIssuers:
                  - '{{env.keycloak.scheme}}://{{env.domains.core.keycloak}}/realms/kagent'
              gateway:
                name: hub-agentgateway-proxy
                namespace: agentgateway-proxy
                hostname: '{{env.domains.app.main}}'
                port: 80
                protocol: HTTP
                # Both clusters' NAT Gateway egress IPs allowlisted alongside the VPN range,
                # same pattern as Keycloak's own hostname above -- retail-returns agents
                # (and refund-approval, on west) hairpin out through the internet and back
                # in via this Gateway's public hostname for A2A/MCP/LLM calls that can't use
                # the in-cluster additionalHostnames listener below (west has no direct
                # cluster-local DNS route to east's hub Gateway).
                sourceRanges:
                  - '{{env.security.vpnSourceRanges}}'
                  - '{{infra.clusters.east.network.natGatewayIp}}/32'
                  - '{{infra.clusters.west.network.natGatewayIp}}/32'
                allowedRoutes:
                  namespaces:
                    from: All
                # Explicit, additional listener for this Service's own in-cluster DNS name --
                # confirmed live: retail-returns agents calling the public hostname from
                # inside the cluster hairpin through the external LB and reliably take ~4.5
                # minutes to connect or time out. This adds a second, specific listener (not
                # a wildcard/match-any-host) so those same in-cluster callers can reach this
                # Gateway directly instead, without loosening the primary listener's own
                # Host-header restriction.
                additionalHostnames:
                  - hub-agentgateway-proxy.agentgateway-proxy.svc.cluster.local
                # Real cert-manager-issued TLS listener alongside the plain HTTP one above --
                # best-practice hardening for the customer-facing gateway (real cert instead
                # of running the app's public traffic over plain HTTP). Unrelated to
                # tokenExchange above -- that's served by the controller, not this Gateway.
                publicHttps:
                  enabled: true
                  issuer: letsencrypt-dns

          - name: solo-ui
            description: Solo Enterprise UI
            mode: management
            version: '{{env.soloUi.version}}'
            phase: post
            namespace: solo-enterprise
            config:
              telemetryNamespace: telemetry
              hostname: '{{env.domains.core.soloUi}}'
              sourceRanges: '{{env.security.vpnSourceRanges}}'
              tls:
                enabled: true
                secretName: solo-ui-tls
                issuer: letsencrypt-dns
              oidc:
                enabled: true
                # Must match kagent-enterprise chart's oidc.issuer — both charts must use
                # the same realm so the management UI's forwarded tokens are accepted by
                # the kagent controller when proxying /api/proxy/cluster/<cluster>/api/*
                issuerUrl: 'https://{{env.domains.core.keycloak}}/realms/kagent'
                backendClientId: kagent-backend
                backendClientSecret: kagent-backend-secret
                frontendClientId: kagent-ui
              # Maps Keycloak groups (kagent realm) → Solo UI roles.
              # Users in these groups get the corresponding Solo UI permission level.
              # Requires keycloak addon to have created the kagent realm with these groups.
              # Default fallback (if omitted): admins/readers/writers → global.Admin/Reader/Writer
              rbacRoleMappings:
                kagent-admins: global.Admin
                kagent-writers: global.Writer
                kagent-readers: global.Reader
              clickhouse:
                persistentVolume:
                  storageClass: gp3
                  size: 100Gi
              products:
                mesh:
                  enabled: true
                agentgateway:
                  enabled: true
                  namespace: agentgateway-system
                  features:
                    cost-management: true
                kagent:
                  enabled: true
                  namespace: kagent-system
              # Real per-product hostnames: the in-app product switcher is dead code in
              # production builds, so each product needs its own URLRewrite alias rather
              # than relying on it.
              productAliases:
                - product: kagent
                  hostname: '{{env.domains.core.kagentUi}}'
                - product: agentgateway
                  hostname: '{{env.domains.core.agentgatewayUi}}'
                - product: mesh
                  hostname: '{{env.domains.core.meshUi}}'

          - name: agentregistry
            description: Solo Enterprise agentregistry
            phase: post
            namespace: agentregistry-system
            version: '{{env.agentregistry.version}}'
            config:
              enterprise: true
              hostname: '{{env.domains.core.agentregistryUi}}'
              sourceRanges: '{{env.security.vpnSourceRanges}}'
              tls:
                secretName: agentregistry-tls
                issuer: letsencrypt-dns
              oidc:
                keycloakHostname: '{{env.domains.core.keycloak}}'
                keycloakTlsEnabled: true
                realm: agentregistry
                clientId: ar-backend
                clientSecret: ar-backend-secret
                publicClientId: ar-ui
                roleClaim: Groups
                superuserRole: admins
              kagentOutboundOidc:
                keycloakHostname: '{{env.domains.core.keycloak}}'
                keycloakTlsEnabled: true
                realm: kagent
                clientId: agentregistry
                clientSecret: agentregistry-secret
              # Required to register west's kagent controller as a remote Runtime: this
              # namespace's own pods need ambient membership to resolve/reach a
              # *.mesh.internal cross-cluster hostname at all (confirmed live: NXDOMAIN
              # from a non-ambient namespace vs. a real answer from an ambient one).
              ambient: true
              # No agentcore block: agents run on the in-cluster kagent runtime instead of
              # AWS Bedrock AgentCore, so there's no IAM/CloudFormation/arctl Runtime setup
              # to run here. Register kagent as a provider (type: kagent) and deploy agents
              # against its runtimeName from a use case (see finflow-demo.yaml for the
              # pattern). otelGateway is also omitted — it only exists to give AgentCore
              # (which runs outside the cluster) a public endpoint to send telemetry to;
              # kagent-hosted agents run in-cluster and use the internal telemetry endpoint
              # directly.

          - name: kagent
            description: Solo Enterprise for kagent AI agent platform
            phase: post
            namespace: kagent-system
            version: '{{env.kagent.version}}'
            config:
              enterprise: true
              oidc:
                keycloakHostname: '{{env.domains.core.keycloak}}'
                keycloakTlsEnabled: true
                realm: kagent
                clientId: kagent-backend
                clientSecret: kagent-backend-secret
              rbac:
                adminsGroup: kagent-admins
                writersGroup: kagent-writers
                readersGroup: kagent-readers
              provider:
                type: openAI
              otel:
                endpoint: '{{env.internal.telemetry.otelTracesCollector}}:4317'
              database:
                storageClass: gp3
              # Announce both clusters to the shared UI's Connected Clusters list. East is
              # the local/management cluster (auto-registered by the UI backend regardless),
              # west is relay-only (solo-ui addon, mode: relay, below); without this it tunnels
              # fine but shows up as unregistered/invisible in the fleet view.
              registerClusters:
                - east
                - west
              # A kagent-created waypoint (e.g. fronting refund-approval, Stage 11a/11b's
              # AccessPolicy) only trusts its own cluster's SPIFFE trust domain by default,
              # rejecting a cross-cluster caller's mTLS identity even though the underlying
              # cert chain validates fine -- confirmed live (agentgateway-enterprise's own
              # TrustDomainVerifier). Needed on both clusters since either could call into
              # the other's waypoint-fronted agents.
              waypointTrustDomain:
                skipValidate: true

      - name: west
        addons:
          - name: telemetry
            phase: post
            namespace: telemetry
            chartVersions:
              alloy: 1.11.0
              otel: 0.165.0
            config:
              mode: agent
              otelGatewayEndpoint: '{{env.internal.telemetry.otelGatewayEndpoint}}:4317'
              lokiPushUrl: '{{env.internal.telemetry.lokiPushUrl}}'

          - name: solo-ui
            mode: relay
            phase: post
            version: '{{env.soloUi.version}}'
            namespace: solo-enterprise
            config:
              tunnel:
                fqdn: '{{env.internal.soloUi.tunnelFqdn}}'
                port: 9000
              telemetry:
                fqdn: '{{env.internal.soloUi.telemetryFqdn}}'
              # Relay chart's validation.yaml requires at least one products.*.enabled=true.
              products:
                mesh:
                  enabled: true
                agentgateway:
                  enabled: true
                  namespace: agentgateway-system
                kagent:
                  enabled: true
                  namespace: kagent-system

          - name: agentgateway
            description: AI Gateway Enterprise spoke
            phase: post
            namespace: agentgateway-system
            version: '{{env.agentgateway.version}}'
            config:
              enterprise: true
              ambientEnabled: true
              globalGateway: true
              soloUiNamespace: solo-enterprise
              tracingRandomSampling: true
              gateway:
                name: spoke-agentgateway-proxy
                namespace: agentgateway-proxy
                port: 80
                protocol: HTTP
                serviceType: ClusterIP
                allowedRoutes:
                  namespaces:
                    from: All

          # A second, fully independent kagent-enterprise controller (own CRDs,
          # own bundled Postgres) -- required for west to actually reconcile and
          # run BYO Agent CRs locally. kagent has no cross-cluster scheduling: an
          # Agent CR only ever materializes a Deployment on whichever cluster's
          # controller reconciles it. The solo-ui relay above only ever gave west
          # read-only telemetry visibility, never agent-hosting capability. No
          # hostname/TLS/OIDC here -- west's kagent isn't meant to expose its own
          # UI; the shared UI on east (relay-registered) is the single pane of
          # glass once this cluster shows up as kagentInstalled=true.
          - name: kagent
            description: Solo Enterprise for kagent AI agent platform (west workload cluster)
            phase: post
            namespace: kagent-system
            version: '{{env.kagent.version}}'
            config:
              enterprise: true
              provider:
                type: openAI
              otel:
                endpoint: '{{env.internal.telemetry.otelTracesCollector}}:4317'
              database:
                storageClass: gp3
              # Standalone install (no co-located solo-enterprise-ui on west), so the
              # chart's hardcoded default issuer (solo-enterprise-ui.kagent.svc.cluster.local)
              # doesn't resolve. Point OIDC at the shared east-hosted Keycloak realm instead.
              oidc:
                keycloakHostname: '{{env.domains.core.keycloak}}'
                keycloakTlsEnabled: true
                realm: kagent
                clientId: kagent-backend
                clientSecret: kagent-backend-secret
              # Makes kagent-controller reachable at kagent-controller.kagent-system.mesh.internal:8083
              # from east (e.g. for AgentRegistry to register this as a remote Runtime).
              ambient: true
              globalServices:
                - kagent-controller
              # See east's kagent step for why this is needed on both clusters.
              waypointTrustDomain:
                skipValidate: true

    global:
      # cilium (the CNI) must install before spire — spire's DaemonSets/StatefulSet
      # can't schedule pods without working pod networking, and pre-phase addons
      # install in this list's order with no dependency-aware reordering.
      - name: cilium
        description: eBPF-based CNI in chaining mode for network policy and observability
        version: 1.19.4
        config:
          mode: chaining
          chainingTarget: aws-cni
          enableHealthProbePolicy: true

      - name: cert-manager
        description: Certificate management for TLS
        version: 1.20.2
        namespace: cert-manager
        config:
          letsencrypt:
            enabled: true
            email: '{{env.acme.email}}'
            region: '{{env.aws.region}}'

      - name: spire
        description: SPIRE workload identity for ztunnel and ambient workloads
        phase: pre
        config:
          certMode: self-signed
          trustDomain: '{{cluster.name}}.local'
          # Each cluster gets its own independent root (pre-generated by
          # SpireRootManager before either cluster installs), federated with
          # istiod's cacerts root and every peer's root (see addons/spire/index.js).
          distinctRoots: true
