apiVersion: agentic.demo/v1
kind: Environment
metadata:
  name: local
  description: Bring-your-own Kubernetes cluster (bare-metal/Talos/kind), installed via `base install --context <name>`

spec:
  # No infraProfile - purely local/bring-your-own cluster. DNS is real (Cloudflare), the
  # cluster itself is not.
  dns:
    provider: cloudflare
    childZone: agentic.lab
    parentZone:
      domain: day0ops.com
    txtOwnerId: agentic-demo-local

  acme:
    email: kasun.talwatta@solo.io

  tls:
    issuer: letsencrypt-dns

  # Okta tenant
  okta:
    domain: dev-12345.okta.com

  keycloak:
    scheme: https

  agentgateway:
    scheme: https
    version: v2026.10.2

  kagent:
    scheme: https
    version: 1.0.0-rc1

  # Agent Substrate chart version
  substrate:
    version: 1.0.0-rc.1-76ace06f
    registry: oci://us-docker.pkg.dev/solo-public/enterprise-substrate-helm
    kubectlAteVersion: v1.0.0-rc1

  addons:
    cert-manager:
      version: 1.20.2
    external-dns:
      version: 1.23.0
    telemetry:
      kube-prom-stack:
        version: 88.0.1
      loki:
        version: 7.2.0
      tempo:
        version: 1.61.3
      alloy:
        version: 1.11.0
      otel:
        version: 0.165.0

  images:
    # Must track kagent.version's release line -- a stale digest fails ActorTemplate's
    # /config materialization at rc1.
    kagentHarness: ghcr.io/kagent-dev/kagent/golang-adk@sha256:5b06741be8cb69c9293477bdbf3203c6526127c533fa940fd9f595a82a801701
    agoraDemo:
      catalogApi: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/agora-demo-catalog-api:v0.5.0
      console: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/agora-demo-console:v0.5.1
      bidsMcp: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/agora-demo-bids-mcp:v0.1.0
      ordersMcp: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/agora-demo-orders-mcp:v0.1.0
      pricingMcp: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/agora-demo-pricing-mcp:v0.1.0
      trustMcp: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/agora-demo-trust-mcp:v0.1.0
      catalogMcp: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/agora-demo-catalog-mcp:v0.5.0

  # Real DNS under agentic.lab.day0ops.com (Cloudflare), managed by external-dns
  domains:
    core:
      keycloak: keycloak.agentic.lab.day0ops.com
      kagentUi: kagent-ui.agentic.lab.day0ops.com
      grafana: grafana.agentic.lab.day0ops.com
      agentgatewayUi: agw-ui.agentic.lab.day0ops.com
    app:
      main: app.agentic.lab.day0ops.com
      agoraDemo: agora.agentic.lab.day0ops.com
