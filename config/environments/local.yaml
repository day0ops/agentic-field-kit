apiVersion: agentic.demo/v1
kind: Environment
metadata:
  name: local
  description: Bring-your-own Kubernetes cluster (bare-metal/Talos/kind), installed via `base install --context <name>`

spec:
  acme:
    email: kasun.talwatta@solo.io

  dns:
    provider: cloudflare
    childZone: agentic.lab
    parentZone:
      domain: day0ops.com
    txtOwnerId: agentic-demo-local

  tls:
    issuer: letsencrypt-dns

  # Okta tenant
  okta:
    domain: dev-12345.okta.com

  keycloak:
    image: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/keycloak:26.7.4
    scheme: https
    loginTheme: keycloak-soloio-login-theme

  agentgateway:
    scheme: https
    version: v2026.11.1

  kagent:
    scheme: https
    version: 2026.11.2

  # Agent Substrate chart version
  substrate:
    version: 1.1.0-alpha1-7354c972
    registry: oci://us-docker.pkg.dev/solo-public/enterprise-substrate-helm
    kubectlAteVersion: v1.1.0-alpha1

  addons:
    cert-manager:
      version: 1.20.2
    external-dns:
      version: 1.23.0
    telemetry:
      kube-prom-stack:
        version: 88.0.1
      loki:
        version: 7.2.0
      tempo:
        version: 1.61.3
      alloy:
        version: 1.11.0
      otel:
        version: 0.165.0

  images:
    # Must track kagent.version's release line - a stale digest fails ActorTemplate's
    # /config materialization. As of 2026.11.2 this is Solo's own build (resolved from the
    # release's release-manifest.json asset, not GHCR's upstream OSS tags).
    kagentHarness: us-docker.pkg.dev/solo-public/kagent-enterprise/golang-adk@sha256:383d602b3640e49229cdb2ebf6f7bb3e8bcd16429ac9a88e03c57c0d8e6954ae
    agoraDemo:
      catalogApi: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/agora-catalog-api:v0.1.0
      console: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/agora-console:v0.1.0
      bidsMcp: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/agora-bids-mcp:v0.1.0
      ordersMcp: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/agora-orders-mcp:v0.1.0
      pricingMcp: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/agora-pricing-mcp:v0.1.0
      trustMcp: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/agora-trust-mcp:v0.1.0
      catalogMcp: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/agora-catalog-mcp:v0.1.0

  # Real DNS under agentic.lab.day0ops.com (Cloudflare), managed by external-dns
  domains:
    core:
      keycloak: keycloak.agentic.lab.day0ops.com
      kagentUi: kagent-ui.agentic.lab.day0ops.com
      grafana: grafana.agentic.lab.day0ops.com
      agentgatewayUi: agw-ui.agentic.lab.day0ops.com
    app:
      main: app.agentic.lab.day0ops.com
      agoraDemo: agora.agentic.lab.day0ops.com
