apiVersion: agentic.demo/v1
kind: Environment
metadata:
  name: aws-dev
  description: AWS environment

spec:
  # AWS configuration
  aws:
    region: ap-southeast-2

  acme:
    email: kasun.talwatta@solo.io

  # DNS configuration for Route53
  dns:
    provider: route53
    parentZone:
      domain: kasunt.apac.fe.solo.io
      hostedZoneId: Z08818701HDZ6PBD6LPXU
    childZone: agentic
    txtOwnerId: agentic

  tls:
    issuer: letsencrypt-dns

  # Okta tenant
  okta:
    domain: integrator-1335842.okta.com

  # CIDR allowlist applied to public-facing NLBs (aws-load-balancer-source-ranges).
  # Checkpoint Harmony SASE documented egress range.
  security:
    vpnSourceRanges:
      - 165.99.148.61/32
      - 64.226.138.86/32
      - 149.28.68.29/32
      - 107.191.62.86/32
      - 64.226.138.86/32
      - 209.35.249.70/32
      - 216.238.92.73/32
      - 209.35.248.11/32
      - 139.84.211.68/32
      - 124.198.249.3/32
      - 155.138.145.87/32

  keycloak:
    image: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/keycloak:26.7.4
    scheme: https
    loginTheme: keycloak-soloio-login-theme

  agentregistry:
    scheme: https
    version: 2026.9.0

  agentgateway:
    scheme: https
    version: v2026.11.1

  kagent:
    scheme: https
    version: 2026.11.2

  substrate:
    version: 1.1.0-alpha1-7354c972
    registry: oci://us-docker.pkg.dev/solo-public/enterprise-substrate-helm
    kubectlAteVersion: v1.1.0-alpha1

  soloUi:
    version: 0.5.6

  addons:
    cert-manager:
      version: 1.20.2
    external-dns:
      version: 1.23.0
    telemetry:
      kube-prom-stack:
        version: 88.0.1
      loki:
        version: 7.2.0
      tempo:
        version: 1.61.3
      alloy:
        version: 1.11.0
      otel:
        version: 0.165.0

  entra:
    # sre-incident-response-system usecase
    sreIRS:
      tenantId: 61d878b3-d211-4da5-99ca-8108d01b2156
      chatAppClientId: 3b575c62-07da-4487-86a3-6408015d2520
      agentGatewayClientId: 6e7ec90c-4b1a-40d6-b096-c0e43641c11a
      repoMcpClientId: e32b61f8-6801-4d3d-993e-882252ca06cd

  images:
    # Harness.spec.workload.image is CRD-enforced digest-pinned (name@sha256:...). Must track
    # kagent.version's release line -- a stale digest fails ActorTemplate's /config
    # materialization. As of 2026.11.2 this is Solo's own build (resolved from the release's
    # release-manifest.json asset, not GHCR's upstream OSS tags).
    kagentHarness: us-docker.pkg.dev/solo-public/kagent-enterprise/golang-adk@sha256:383d602b3640e49229cdb2ebf6f7bb3e8bcd16429ac9a88e03c57c0d8e6954ae
    finflow:
      marketDataAgent: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/finflow-market-data-agent:0.1.0
      newsSentimentAgent: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/finflow-news-sentiment-agent:0.1.0
    retailReturns:
      supportTriage: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/retail-returns-support-triage:v0.1.0
      orderLookup: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/retail-returns-order-lookup:v0.1.0
      fraudCheck: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/retail-returns-fraud-check:v0.1.0
      refundApproval: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/retail-returns-refund-approval:v0.1.0
      orderDb: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/retail-returns-order-db:v0.1.0
      payment: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/retail-returns-payment:v0.1.0
      shipping: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/retail-returns-shipping:v0.1.0
      inventory: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/retail-returns-inventory:v0.1.0
      fraudScoring: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/retail-returns-fraud-scoring:v0.1.0
      carrier: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/retail-returns-carrier:v0.1.0
      loyaltyRewards: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/retail-returns-loyalty-rewards:v0.1.0
      ui: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/retail-returns-ui:v0.1.0
      piiGuardrail: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/retail-returns-pii-guardrail:v0.1.0
      stagePolicyController: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/retail-returns-stage-policy-controller:v0.1.0
      returnsEligibility: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/retail-returns-returns-eligibility:v0.1.0
      accessPolicyTestHarness: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/retail-returns-access-policy-test-harness:v0.1.0
    sreIRS:
      agent: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/sre-incident-response-agent:v0.1.0
      incidentMcp: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/sre-incident-response-incident-mcp:v0.1.0
      runbookMcp: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/sre-incident-response-runbook-mcp:v0.1.0
      repoMcp: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/sre-incident-response-repo-mcp:v0.1.0
      chatApp: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/sre-incident-response-chat-app:v0.1.0
    agoraDemo:
      catalogApi: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/agora-catalog-api:v0.1.1
      console: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/agora-console:v0.1.1
      bidsMcp: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/agora-bids-mcp:v0.1.1
      ordersMcp: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/agora-orders-mcp:v0.1.1
      pricingMcp: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/agora-pricing-mcp:v0.1.1
      trustMcp: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/agora-trust-mcp:v0.1.1
      catalogMcp: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/agora-catalog-mcp:v0.1.1

  # Internal cluster/mesh FQDNs (not publicly routable)
  internal:
    gateway:
      internalHost: http://hub-agentgateway-proxy.agentgateway-proxy.svc.cluster.local
    telemetry:
      otelTracesCollector: opentelemetry-collector-traces.telemetry.svc.cluster.local
      otelGatewayEndpoint: opentelemetry-collector-gateway.telemetry.mesh.internal
      lokiPushUrl: http://loki.telemetry.mesh.internal:3100/loki/api/v1/push
    agentregistry:
      telemetryEndpoint: http://agentregistry-enterprise-telemetry-collector.agentregistry-system.svc.cluster.local:4318
    kagent:
      controllerUrl: http://kagent-controller.kagent-system.svc.cluster.local:8083
    soloUi:
      tunnelFqdn: solo-enterprise-ui.solo-enterprise.mesh.internal
      telemetryFqdn: solo-enterprise-telemetry-gateway.solo-enterprise.mesh.internal

  # Domain mappings - auto-generated pattern: <service>.<childZone>.<parentDomain>
  # core: shared platform/product hostnames, used across every usecase.
  # app: per-usecase dedicated hostnames (own Gateway), one entry per usecase that has one.
  domains:
    core:
      keycloak: keycloak.agentic.kasunt.apac.fe.solo.io
      grafana: grafana.agentic.kasunt.apac.fe.solo.io
      agentregistryUi: agentregistry-ui.agentic.kasunt.apac.fe.solo.io
      agentregistryTelemetry: agentregistry-telemetry.agentic.kasunt.apac.fe.solo.io
      soloUi: solo-ui.agentic.kasunt.apac.fe.solo.io
      kagentUi: kagent-ui.agentic.kasunt.apac.fe.solo.io
      agentgatewayUi: agw-ui.agentic.kasunt.apac.fe.solo.io
      meshUi: mesh-ui.agentic.kasunt.apac.fe.solo.io
    app:
      main: app.agentic.kasunt.apac.fe.solo.io
      retailReturns: retail-returns.agentic.kasunt.apac.fe.solo.io
      sreIRS: sre-irs.agentic.kasunt.apac.fe.solo.io
      agoraDemo: agora.agentic.kasunt.apac.fe.solo.io
