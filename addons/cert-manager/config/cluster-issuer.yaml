# ClusterIssuer for self-signed certificates (for development / local clusters)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
  labels:
    app.kubernetes.io/managed-by: agentic-demo
spec:
  selfSigned: {}

---
# ClusterIssuer for Let's Encrypt using DNS-01 challenge with Route53
# Requires IRSA (IAM Roles for Service Accounts) configured for cert-manager
# Reference: https://cert-manager.io/docs/configuration/acme/dns01/route53/
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns
  labels:
    app.kubernetes.io/managed-by: agentic-demo
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: '{{ACME_EMAIL}}'
    privateKeySecretRef:
      name: letsencrypt-dns
    solvers:
      - dns01:
          route53:
            region: '{{AWS_REGION}}'
            # When using IRSA, no explicit credentials needed
            # cert-manager will use the service account's IAM role
