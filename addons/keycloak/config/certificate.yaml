apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: '{{TLS_SECRET_NAME}}'
  namespace: '{{NAMESPACE}}'
spec:
  secretName: '{{TLS_SECRET_NAME}}'
  issuerRef:
    name: '{{CLUSTER_ISSUER_NAME}}'
    kind: ClusterIssuer
  commonName: '{{HOSTNAME}}'
  dnsNames:
    - '{{HOSTNAME}}'
{{CERT_INTERNAL_DNS_NAMES}}
  subject:
    organizations:
      - '{{CERT_ORGANIZATION}}'
    organizationalUnits:
      - keycloak
