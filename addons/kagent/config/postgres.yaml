# Agent Substrate's bundled development PostgreSQL (ate-api-server's own state store), adapted
# from solo-io/substrate's manifests/ate-install/postgres/postgres.yaml + the kind overlay's
# resource/storage sizing (manifests/ate-install/kind/postgres) -- there is no size10 override
# here, this is the small, single-node footprint. Cert-authenticated via the postgres.podcert.ate.dev
# and servicedns.podcert.ate.dev signers the pod certificate controller already serves -- no
# separate TLS bootstrap needed.
#
# pg_hba.conf's login list also carries kagent_owner_user/kagent_readwrite_user, beyond solo-io's
# own substrate-only upstream file -- kagent-controller shares this instance too (see
# _wireKagentControllerPostgres), confirmed live (2026-10-31) to need its own pg_hba.conf entry
# or every connection fails "no pg_hba.conf entry for host ..., SSL encryption".
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: ate-system
data:
  postgresql.conf: |
    listen_addresses = '*'
    ssl = on
    ssl_cert_file = '/run/servicedns.podcert.ate.dev/credential-bundle.pem'
    ssl_key_file = '/run/servicedns.podcert.ate.dev/credential-bundle.pem'
    ssl_ca_file = '/run/postgres.podcert.ate.dev/trust-bundle.pem'
    hba_file = '/etc/postgresql/pg_hba.conf'
  pg_hba.conf: |
    local all all trust
    hostssl all postgres all reject
    hostssl atepg substrate_owner_user,substrate_readwrite_user,kagent_owner_user,kagent_readwrite_user all cert
  reload-tls.sh: |
    set -eu
    trap 'exit 0' TERM INT

    CERT=/run/servicedns.podcert.ate.dev/credential-bundle.pem
    CA=/run/postgres.podcert.ate.dev/trust-bundle.pem
    INTERVAL=60

    reloaded=""
    while true; do
      current="$(sha256sum "${CERT}" "${CA}" /etc/postgresql/pg_hba.conf)"
      if [ "${current}" != "${reloaded}" ] \
        && psql -U "${POSTGRES_USER}" -d postgres -Atc 'SELECT pg_reload_conf()' >/dev/null 2>&1; then
        reloaded="${current}"
        echo "$(date -u +%FT%TZ) reloaded TLS configuration"
      fi
      sleep "${INTERVAL}" &
      wait $!
    done
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ate-system
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ate-system
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: tls-reloader
          restartPolicy: Always
          image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          securityContext:
            runAsUser: 70
          env:
            - name: POSTGRES_USER
              value: postgres
          command:
            - /bin/sh
            - /etc/postgresql/reload-tls.sh
          volumeMounts:
            - name: config
              mountPath: /etc/postgresql
            - name: servicedns
              mountPath: /run/servicedns.podcert.ate.dev
              readOnly: true
            - name: postgres-ca
              mountPath: /run/postgres.podcert.ate.dev
              readOnly: true
            - name: socket
              mountPath: /var/run/postgresql
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
      containers:
        - name: postgres
          image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - |
                    until psql -U "${POSTGRES_USER}" -d postgres -Atc 'SELECT 1' >/dev/null 2>&1; do
                      sleep 1
                    done
                    if ! psql -U "${POSTGRES_USER}" -d postgres -Atc \
                      "SELECT 1 FROM pg_database WHERE datname = 'atepg'" | grep -qx 1; then
                      createdb -U "${POSTGRES_USER}" atepg
                    fi
          env:
            - name: POSTGRES_DB
              value: atepg
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - nc -z 127.0.0.1 5432
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -U "${POSTGRES_USER}" -d postgres
            initialDelaySeconds: 10
            periodSeconds: 10
          args:
            - -c
            - config_file=/etc/postgresql/postgresql.conf
          volumeMounts:
            - name: config
              mountPath: /etc/postgresql
            - name: servicedns
              mountPath: /run/servicedns.podcert.ate.dev
              readOnly: true
            - name: postgres-ca
              mountPath: /run/postgres.podcert.ate.dev
              readOnly: true
            - name: socket
              mountPath: /var/run/postgresql
            - name: data
              mountPath: /var/lib/postgresql/data
          # Right-sized for a single-node local/demo cluster (solo-io/substrate's own "kind"
          # overlay sizing), not the multi-core production footprint the base manifest assumes.
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: '2'
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: postgres-config
        - name: servicedns
          projected:
            defaultMode: 0600
            sources:
              - podCertificate:
                  signerName: servicedns.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
        - name: socket
          emptyDir: {}
        - name: postgres-ca
          projected:
            sources:
              - clusterTrustBundle:
                  signerName: postgres.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            # Right-sized for a local/demo cluster, not the 500Gi the base manifest assumes.
            storage: 1Gi
