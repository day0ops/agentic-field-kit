# OTel Collector — Traces Agent (spoke/remote clusters)
# Receives OTLP from local istiod/proxies and gateways.
# Forwards all traces to east OTel gateway via single OTLP endpoint.

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  exporters:
    otlp/east-gateway:
      endpoint: '{{OTEL_GATEWAY_ENDPOINT}}'
      tls:
        insecure: true

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/east-gateway]
