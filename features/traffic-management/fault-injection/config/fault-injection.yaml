apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fault-injection
  namespace: default
spec:
  parentRefs:
    - name: waypoint
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: x-fault-injected
                value: 'true'
      backendRefs:
        - name: httpbin
          port: 8080
