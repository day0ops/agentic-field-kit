apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: egress-authz
  namespace: egress
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: egress-waypoint
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/default/sa/default
      to:
        - operation:
            hosts:
              - external.example.com
